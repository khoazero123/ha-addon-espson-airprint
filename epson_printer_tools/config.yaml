name: Epson Printer Tools
version: "1.0.0"
slug: epson_printer_tools
description: >-
  Discover Epson inkjets on the LAN (or set the IP manually), run nozzle check and
  head cleaning as native ESC/P-R jobs over LPR, and track usage counters with
  derived "last print" / "last head cleaning" timestamps.
url: https://github.com/KhoaZero123/ha-epson-printer-tools
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:printer-settings
panel_title: Epson Printer
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  printer_ip: ""
  scan_subnet: ""
  poll_interval: 60
  utc_offset: 7
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_prefix: epson_printer
schema:
  printer_ip: str?
  scan_subnet: str?
  poll_interval: int(15,3600)
  utc_offset: int(-12,14)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str?
