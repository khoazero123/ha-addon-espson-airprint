name: Epson Printer Tools
version: "1.1.2"
slug: epson_printer_tools
description: >-
  Discover Epson inkjets on the LAN (or set the IP manually), run nozzle check and
  head cleaning as native ESC/P-R jobs over LPR, track usage counters with
  derived "last print" / "last head cleaning" timestamps, and share the printer to
  iPhone/iPad/Mac as an AirPrint queue (CUPS + mDNS inside the add-on).
url: https://github.com/khoazero123/ha-addon-espson-airprint
arch:
  - aarch64
  - amd64
image: ghcr.io/khoazero123/{arch}-epson-printer-tools
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:printer-settings
panel_title: Epson Printer
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  printer_ip: ""
  scan_subnet: ""
  poll_interval: 60
  utc_offset: 7
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_prefix: epson_printer
  airprint_enabled: true
  airprint_name: Epson L8050 AirPrint
  airprint_location: ""
schema:
  printer_ip: str?
  scan_subnet: str?
  poll_interval: int(15,3600)
  utc_offset: int(-12,14)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str?
  airprint_enabled: bool
  airprint_name: str?
  airprint_location: str?
