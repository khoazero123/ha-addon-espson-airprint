name: Build add-on images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ADDON: epson_printer_tools
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          version=$(grep -E '^version:' "$ADDON/config.yaml" | head -1 | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ env.ADDON }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=docker.io/library/python:3.12-alpine3.20
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.arch }}-epson-printer-tools:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.arch }}-epson-printer-tools:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
